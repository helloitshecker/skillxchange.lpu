<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8faf7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Trade skills, not money. Find your next learning partner on campus." />
    <title>SkillXChange — Learn together</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@1..144,100..1000&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=m14" />
    <script src="/config.js"></script>
    <script type="module" src="/app.js?v=m10"></script>

    <script>
      (function () {
        var theme = localStorage.getItem("skillxchange-theme") || "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <noscript>
      <style>
        .js-required { display: grid !important; }
        #app, .loading-screen, #toast-region { display: none !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div class="js-required" id="js-required" style="display: none">
      <div class="js-required-content">
        <div class="js-required-icon">
          <span class="material-symbols-rounded">javascript</span>
        </div>
        <h1>JavaScript required</h1>
        <p>SkillXChange runs entirely in your browser. Enable JavaScript and reload the page to continue.</p>
      </div>
    </div>

    <div class="loading-screen visible" id="loading-screen" data-loading-type="app" role="status" aria-live="polite">
      <div class="loading-content">
        <div class="loading-brand">
          <div class="loading-logo">
            <img class="loading-mark" src="/logo.svg" alt="" aria-hidden="true" />
            <div class="loading-ring"></div>
            <div class="loading-ring ring-2"></div>
          </div>
        </div>
        <div class="loading-text">
          <span class="loading-title">SkillXChange</span>
          <span class="loading-subtitle">Preparing your experience</span>
        </div>
        <div class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </div>

    <div id="app"></div>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
  </body>
</html>
